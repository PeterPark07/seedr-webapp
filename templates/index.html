<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seedr Torrent Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- HLS.js for browser audio/video compatibility -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
    <style>
        :root {
            --bg-base: #f4f5f7;
            --surface: #ffffff;
            --surface-hover: #f8fafc;
            --border-subtle: #e2e8f0;
            --border-strong: #cbd5e1;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            
            --accent-warm: #ea580c;
            --accent-warm-light: #fff7ed;

            --success: #059669;
            --success-light: #ecfdf5;

            --danger: #dc2626;
            --danger-light: #fef2f2;
            
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-body);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 2.5rem 1.5rem 5rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 940px;
            margin: 0 auto;
        }

        /* Top Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: #ffffff;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-heading);
            letter-spacing: -0.02em;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--success);
            background: var(--success-light);
            border: 1px solid rgba(5, 150, 105, 0.2);
            padding: 0.25rem 0.65rem;
            border-radius: 999px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
        }

        /* Storage Card */
        .storage-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 1.15rem 1.35rem;
            margin-bottom: 1.75rem;
            box-shadow: var(--shadow-sm);
        }

        .storage-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .storage-values {
            font-weight: 600;
            color: var(--text-heading);
            font-family: 'JetBrains Mono', monospace;
        }

        .storage-bar-track {
            height: 7px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }

        .storage-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 999px;
            transition: width 0.4s ease;
        }

        /* Add Torrent Input Box */
        .add-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 1.35rem;
            margin-bottom: 1.75rem;
            box-shadow: var(--shadow-sm);
        }

        .add-card h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
        }

        .url-input {
            flex: 1;
            background: #f8fafc;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.9rem;
            color: var(--text-heading);
            font-size: 0.88rem;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: all 0.15s;
        }

        .url-input:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .url-input::placeholder {
            color: var(--text-dim);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Button styles */
        .btn {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            padding: 0.55rem 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            transition: all 0.15s;
            text-decoration: none;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: #ffffff;
            color: var(--text-body);
            border-color: var(--border-subtle);
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: var(--border-strong);
            color: var(--text-heading);
        }

        .btn-warm {
            background: var(--accent-warm-light);
            color: var(--accent-warm);
            border-color: rgba(234, 88, 12, 0.25);
        }

        .btn-warm:hover {
            background: #fed7aa;
        }

        .btn-danger {
            background: var(--danger-light);
            color: var(--danger);
            border-color: rgba(220, 38, 38, 0.2);
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-sm {
            padding: 0.35rem 0.65rem;
            font-size: 0.78rem;
        }

        .upload-hint {
            margin-top: 0.65rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .upload-hint label {
            color: var(--primary);
            font-weight: 500;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Active Tasks */
        #active-tasks-container {
            display: none;
            margin-bottom: 1.75rem;
        }

        .section-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.65rem;
        }

        .task-card {
            background: #ffffff;
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: var(--radius-md);
            padding: 0.95rem 1.15rem;
            margin-bottom: 0.65rem;
            box-shadow: var(--shadow-sm);
        }

        .task-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .task-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-heading);
        }

        .task-stats {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.45rem;
        }

        /* Explorer Card */
        .explorer-card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .breadcrumbs-bar {
            padding: 0.75rem 1.15rem;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .crumb-link {
            color: var(--primary);
            cursor: pointer;
            font-weight: 500;
        }

        .crumb-link:hover {
            text-decoration: underline;
        }

        .crumb-sep {
            color: var(--text-dim);
        }

        .crumb-current {
            color: var(--text-heading);
            font-weight: 600;
        }

        /* Items List */
        .items-list {
            list-style: none;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.15rem;
            border-bottom: 1px solid var(--border-subtle);
            transition: background 0.1s;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-row:hover {
            background-color: var(--surface-hover);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
            min-width: 0;
        }

        .item-icon {
            font-size: 1.15rem;
            width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-name {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-heading);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-name.folder-click {
            cursor: pointer;
            font-weight: 600;
            color: var(--text-heading);
        }

        .item-name.folder-click:hover {
            color: var(--primary);
        }

        .item-size {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-left: 0.5rem;
            white-space: nowrap;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-left: 0.75rem;
        }

        .empty-state {
            padding: 3.5rem 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        /* Video Player Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-card {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 820px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .modal-header {
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
        }

        .modal-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-heading);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 700px;
        }

        .modal-close-btn {
            background: transparent;
            border: none;
            font-size: 1.25rem;
            color: var(--text-muted);
            cursor: pointer;
            line-height: 1;
        }

        .video-wrapper {
            background: #000000;
            position: relative;
            display: flex;
            justify-content: center;
        }

        #modal-video {
            width: 100%;
            max-height: 480px;
            outline: none;
        }

        .stream-controls-bar {
            padding: 0.75rem 1.25rem;
            background: #ffffff;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            font-size: 0.82rem;
        }

        .stream-mode-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge-pill {
            font-size: 0.72rem;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
            background: #e2e8f0;
            color: var(--text-body);
        }

        .badge-pill.active {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid rgba(79, 70, 229, 0.2);
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 1100;
        }

        .toast {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            color: var(--text-heading);
            padding: 0.65rem 1.15rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            animation: slideUp 0.2s ease;
        }

        .toast.success {
            border-left: 3.5px solid var(--success);
        }

        .toast.error {
            border-left: 3.5px solid var(--danger);
        }

        @keyframes slideUp {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <span class="brand-title">Seedr Minimal Cloud</span>
        </div>
        <div style="display:flex; align-items:center; gap:0.75rem;">
            <div class="status-badge" id="user-badge">
                <span class="status-dot"></span>
                <span id="user-display-label">{{ user_label }}</span>
            </div>
            <a href="/logout" class="btn btn-sm btn-outline" style="text-decoration:none;">Logout</a>
        </div>
    </header>

    <!-- Storage Bar -->
    <div class="storage-card">
        <div class="storage-meta">
            <span>Storage Usage</span>
            <span class="storage-values" id="storage-text">Loading...</span>
        </div>
        <div class="storage-bar-track">
            <div class="storage-bar-fill" id="storage-bar"></div>
        </div>
    </div>

    <!-- Add Torrent / Magnet Input -->
    <div class="add-card">
        <h2><span>📥</span> Add Torrent Link or File</h2>
        <form onsubmit="submitTorrent(event)">
            <div class="input-row">
                <input type="text" id="magnet-input" class="url-input" placeholder="Paste magnet:?xt=urn:btih:... or torrent web link" autocomplete="off">
                <button type="submit" class="btn btn-primary" id="add-btn">
                    <span>⚡ Fetch</span>
                </button>
            </div>
            <div class="upload-hint">
                <span>Or upload a local file:</span>
                <input type="file" id="torrent-file" accept=".torrent" style="display:none;" onchange="uploadTorrentFile(event)">
                <label for="torrent-file">Browse .torrent</label>
            </div>
        </form>
    </div>

    <!-- Active In-Progress Tasks -->
    <div id="active-tasks-container">
        <div class="section-label">Active Transfers</div>
        <div id="tasks-list"></div>
    </div>

    <!-- File Explorer -->
    <div class="explorer-card">
        <div class="breadcrumbs-bar" id="breadcrumbs-bar">
            <span class="crumb-link" onclick="loadFolder(0, 'Home')">Home</span>
        </div>
        <ul class="items-list" id="items-list">
            <li class="empty-state">Loading your files...</li>
        </ul>
    </div>
</div>

<!-- Video Stream Modal with Audio & Original Quality Support -->
<div class="modal-overlay" id="video-modal" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title" id="video-title">Video Stream</span>
            <button class="modal-close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="video-wrapper">
            <video id="modal-video" controls playsinline></video>
        </div>
        <div class="stream-controls-bar">
            <div class="stream-mode-group">
                <span style="font-weight:600; color:var(--text-muted); margin-right:0.25rem;">Audio/Stream Mode:</span>
                <button class="btn btn-sm btn-outline" id="btn-mode-hls" onclick="switchStreamMode('hls')">
                    🎵 Web Stream (Audio OK)
                </button>
                <button class="btn btn-sm btn-outline" id="btn-mode-raw" onclick="switchStreamMode('raw')">
                    ✨ Original File (Bitrate)
                </button>
            </div>
            <div>
                <button class="btn btn-sm btn-outline" onclick="copyVlcLink()">
                    📋 Copy VLC Link
                </button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
    let currentFolderId = 0;
    let breadcrumbsHistory = [{ id: 0, name: "Home" }];
    let pollInterval = null;
    let hlsInstance = null;
    let currentStreamData = null;
    let activeStreamMode = 'hls';

    function showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.innerText = msg;
        container.appendChild(t);
        setTimeout(() => {
            t.style.opacity = '0';
            setTimeout(() => t.remove(), 250);
        }, 3200);
    }

    async function loadQuota() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            if (data.success) {
                if (data.user_label) {
                    document.getElementById('user-display-label').innerText = data.user_label;
                }
                document.getElementById('storage-text').innerText = 
                    `${data.space_used_formatted} of ${data.space_max_formatted} (${data.pct}%)`;
                document.getElementById('storage-bar').style.width = `${Math.min(data.pct, 100)}%`;
            }
        } catch (e) {
            console.error("Quota error", e);
        }
    }

    async function loadFolder(folderId = 0, folderName = "Home") {
        currentFolderId = folderId;
        try {
            const res = await fetch(`/api/folder/${folderId}`);
            const data = await res.json();
            if (!data.success) {
                showToast(data.error || "Failed to load directory", "error");
                return;
            }

            updateBreadcrumbs(folderId, folderName);
            renderTasks(data.tasks || []);
            renderItems(data.folders || [], data.files || []);
        } catch (e) {
            showToast("Failed to load folder: " + e, "error");
        }
    }

    function updateBreadcrumbs(folderId, folderName) {
        if (folderId === 0) {
            breadcrumbsHistory = [{ id: 0, name: "Home" }];
        } else {
            const idx = breadcrumbsHistory.findIndex(b => b.id === folderId);
            if (idx !== -1) {
                breadcrumbsHistory = breadcrumbsHistory.slice(0, idx + 1);
            } else {
                breadcrumbsHistory.push({ id: folderId, name: folderName });
            }
        }

        const bar = document.getElementById('breadcrumbs-bar');
        bar.innerHTML = breadcrumbsHistory.map((c, i) => {
            const isLast = i === breadcrumbsHistory.length - 1;
            if (isLast) return `<span class="crumb-current">${c.name}</span>`;
            return `<span class="crumb-link" onclick="loadFolder(${c.id}, '${c.name}')">${c.name}</span><span class="crumb-sep">/</span>`;
        }).join('');
    }

    function renderTasks(tasks) {
        const container = document.getElementById('active-tasks-container');
        const listEl = document.getElementById('tasks-list');

        if (!tasks || tasks.length === 0) {
            container.style.display = 'none';
            listEl.innerHTML = '';
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
            return;
        }

        container.style.display = 'block';
        listEl.innerHTML = tasks.map(t => {
            const progress = t.progress || 0;
            return `
            <div class="task-card">
                <div class="task-row">
                    <span class="task-title">⚡ ${t.name || 'Torrent Downloading'}</span>
                    <button class="btn btn-sm btn-danger" onclick="cancelTask(${t.id})">✕ Cancel</button>
                </div>
                <div class="storage-bar-track">
                    <div class="storage-bar-fill" style="width: ${progress}%; background: var(--primary);"></div>
                </div>
                <div class="task-stats">
                    <span>${progress}% done</span>
                    <span>•</span>
                    <span>Speed: ${t.download_rate ? (t.download_rate / 1024).toFixed(1) + ' KB/s' : 'Queueing'}</span>
                    <span>•</span>
                    <span>Seeders: ${t.seeders || 0}</span>
                </div>
            </div>`;
        }).join('');

        if (!pollInterval) {
            pollInterval = setInterval(() => {
                loadFolder(currentFolderId, breadcrumbsHistory[breadcrumbsHistory.length - 1].name);
                loadQuota();
            }, 3000);
        }
    }

    function safeEscape(str) {
        if (!str) return '';
        return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function renderItems(folders, files) {
        const listEl = document.getElementById('items-list');
        if ((!folders || folders.length === 0) && (!files || files.length === 0)) {
            listEl.innerHTML = `<li class="empty-state">No files or folders yet. Paste a magnet link above to fetch.</li>`;
            return;
        }

        let html = '';
        for (const fo of (folders || [])) {
            const folderName = fo.name || fo.path || 'Folder';
            const escapedName = safeEscape(folderName);
            html += `
            <li class="item-row">
                <div class="item-left">
                    <span class="item-icon">📁</span>
                    <span class="item-name folder-click" onclick="loadFolder(${fo.id}, '${escapedName}')">${folderName}</span>
                    <span class="item-size">${fo.size_formatted || ''}</span>
                </div>
                <div class="item-actions">
                    <button class="btn btn-sm btn-warm" onclick="downloadFolderZip(${fo.id}, '${escapedName}')">
                        📦 Download ZIP
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteItem('folder', ${fo.id}, '${escapedName}')">
                        🗑️
                    </button>
                </div>
            </li>`;
        }

        for (const fi of (files || [])) {
            const fileName = fi.name || 'File';
            const escapedFileName = safeEscape(fileName);
            const isVideo = fi.is_video || fileName.match(/\.(mkv|mp4|webm|avi|mov)$/i);
            html += `
            <li class="item-row">
                <div class="item-left">
                    <span class="item-icon">${isVideo ? '🎬' : '📄'}</span>
                    <span class="item-name">${fileName}</span>
                    <span class="item-size">${fi.size_formatted || ''}</span>
                </div>
                <div class="item-actions">
                    ${isVideo ? `<button class="btn btn-sm btn-outline" onclick="openVideoStream(${fi.id})">▶️ Stream</button>` : ''}
                    <button class="btn btn-sm btn-outline" onclick="downloadFile(${fi.id})">⬇️ Download</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteItem('file', ${fi.id}, '${escapedFileName}')">🗑️</button>
                </div>
            </li>`;
        }

        listEl.innerHTML = html;
    }

    // Submit Magnet
    async function submitTorrent(e) {
        e.preventDefault();
        const input = document.getElementById('magnet-input');
        const magnet = input.value.trim();
        if (!magnet) return;

        const btn = document.getElementById('add-btn');
        btn.disabled = true;
        btn.innerText = "Adding...";

        try {
            const fd = new FormData();
            fd.append('magnet', magnet);
            fd.append('folder_id', currentFolderId);

            const res = await fetch('/api/torrent/add', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                showToast("Torrent queued in cloud!", "success");
                input.value = "";
                loadFolder(currentFolderId, breadcrumbsHistory[breadcrumbsHistory.length - 1].name);
                loadQuota();
            } else {
                showToast(data.error || "Failed to add torrent", "error");
            }
        } catch (err) {
            showToast("Network error: " + err, "error");
        } finally {
            btn.disabled = false;
            btn.innerText = "⚡ Fetch";
        }
    }

    // Upload .torrent
    async function uploadTorrentFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        showToast(`Processing ${file.name}...`, "success");
        try {
            const fd = new FormData();
            fd.append('torrent_file', file);
            fd.append('folder_id', currentFolderId);

            const res = await fetch('/api/torrent/add', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                showToast("Torrent file added to cloud!", "success");
                loadFolder(currentFolderId, breadcrumbsHistory[breadcrumbsHistory.length - 1].name);
                loadQuota();
            } else {
                showToast(data.error || "Failed to process .torrent", "error");
            }
        } catch (err) {
            showToast("Upload error: " + err, "error");
        }
    }

    // Direct Download
    async function downloadFile(fileId) {
        try {
            showToast("Fetching direct download link...", "success");
            const res = await fetch(`/api/file/${fileId}/url`);
            const data = await res.json();
            if (data.success && data.url) {
                window.location.href = data.url;
            } else {
                showToast("Could not generate link", "error");
            }
        } catch (e) {
            showToast("Download error: " + e, "error");
        }
    }

    // ZIP Download (Zero CAPTCHA)
    async function downloadFolderZip(folderId, folderName) {
        try {
            showToast(`Generating ZIP for '${folderName}' (Zero CAPTCHA)...`, "success");
            const res = await fetch(`/api/folder/${folderId}/zip`);
            const data = await res.json();
            if (data.success && data.url) {
                window.location.href = data.url;
                showToast("ZIP download started!", "success");
            } else {
                showToast("Failed to generate ZIP", "error");
            }
        } catch (e) {
            showToast("Archive error: " + e, "error");
        }
    }

    // Smart Video Streamer with Audio Fix
    async function openVideoStream(fileId) {
        try {
            showToast("Preparing stream...", "success");
            const res = await fetch(`/api/file/${fileId}/stream`);
            const data = await res.json();

            if (!data.success) {
                showToast("Could not open stream", "error");
                return;
            }

            currentStreamData = data;
            document.getElementById('video-title').innerText = data.name;
            document.getElementById('video-modal').style.display = 'flex';

            // Default to HLS if available for 100% audio compatibility
            if (data.hls_url) {
                switchStreamMode('hls');
            } else {
                switchStreamMode('raw');
            }
        } catch (e) {
            showToast("Stream error: " + e, "error");
        }
    }

    function switchStreamMode(mode) {
        if (!currentStreamData) return;
        activeStreamMode = mode;
        const video = document.getElementById('modal-video');

        const btnHls = document.getElementById('btn-mode-hls');
        const btnRaw = document.getElementById('btn-mode-raw');

        // Reset player
        if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
        }
        video.pause();
        video.removeAttribute('src');
        video.load();

        if (mode === 'hls' && currentStreamData.hls_url) {
            btnHls.style.borderColor = 'var(--primary)';
            btnHls.style.color = 'var(--primary)';
            btnRaw.style.borderColor = 'var(--border-subtle)';
            btnRaw.style.color = 'var(--text-body)';

            if (Hls.isSupported()) {
                hlsInstance = new Hls({ enableWorker: true });
                hlsInstance.loadSource(currentStreamData.hls_url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari native HLS
                video.src = currentStreamData.hls_url;
                video.play().catch(() => {});
            }
            showToast("Playing HLS Stream (Audio converted to AAC for browsers)", "success");
        } else {
            // Raw Original Bitrate
            btnRaw.style.borderColor = 'var(--primary)';
            btnRaw.style.color = 'var(--primary)';
            btnHls.style.borderColor = 'var(--border-subtle)';
            btnHls.style.color = 'var(--text-body)';

            video.src = currentStreamData.raw_url;
            video.play().catch(() => {});
            showToast("Playing Original Bitrate File (Full 1080p untouched)", "success");
        }
    }

    function copyVlcLink() {
        if (!currentStreamData || !currentStreamData.raw_url) return;
        navigator.clipboard.writeText(currentStreamData.raw_url).then(() => {
            showToast("Copied original stream link! Paste directly into VLC (Ctrl+V)", "success");
        });
    }

    function closeModal(e) {
        const modal = document.getElementById('video-modal');
        const video = document.getElementById('modal-video');
        if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
        }
        video.pause();
        video.removeAttribute('src');
        video.load();
        modal.style.display = 'none';
        currentStreamData = null;
    }

    async function cancelTask(taskId) {
        if (!confirm("Cancel this download?")) return;
        try {
            const res = await fetch(`/api/task/${taskId}/cancel`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                showToast("Task cancelled", "success");
                loadFolder(currentFolderId, breadcrumbsHistory[breadcrumbsHistory.length - 1].name);
            }
        } catch (e) {
            showToast("Cancel error: " + e, "error");
        }
    }

    async function deleteItem(type, id, name) {
        if (!confirm(`Delete ${type} '${name}'?`)) return;
        try {
            const fd = new FormData();
            fd.append('type', type);
            fd.append('id', id);

            const res = await fetch('/api/item/delete', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success) {
                showToast(`Deleted ${name}`, "success");
                loadFolder(currentFolderId, breadcrumbsHistory[breadcrumbsHistory.length - 1].name);
                loadQuota();
            } else {
                showToast("Delete failed", "error");
            }
        } catch (e) {
            showToast("Delete error: " + e, "error");
        }
    }

    // Startup
    loadQuota();
    loadFolder(0, 'Home');
</script>
</body>
</html>
