<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal Torrent Cloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f4f5f7;
            --surface: #ffffff;
            --border: #e2e8f0;
            --border-focus: #4f46e5;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --radius-sm: 8px;
            --radius-md: 14px;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-body);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: #ffffff;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0.85rem;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-heading);
            letter-spacing: -0.02em;
        }

        .brand-sub {
            font-size: 0.84rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 0.45rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 2.75rem 0.75rem 0.95rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-heading);
            outline: none;
            transition: all 0.15s ease;
        }

        .input-field:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .toggle-password {
            position: absolute;
            right: 0.85rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            transition: color 0.15s;
        }

        .toggle-password:hover {
            color: var(--text-heading);
        }

        .helper-text {
            font-size: 0.76rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            line-height: 1.4;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.8rem 1rem;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.05s;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert-error {
            background: var(--danger-bg);
            border: 1px solid rgba(220, 38, 38, 0.25);
            color: var(--danger);
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            margin-bottom: 1.25rem;
            display: none;
            line-height: 1.45;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-header">
        <div class="brand-icon">⚡</div>
        <h1 class="brand-title">Personal Torrent Cloud</h1>
        <p class="brand-sub">Private Seedr storage & streaming hub</p>
    </div>

    <div id="error-box" class="alert-error"></div>

    <form id="form-login" onsubmit="submitLogin(event)">
        <div class="form-group">
            <label for="passcode-input">Master Passcode</label>
            <div class="input-wrapper">
                <input 
                    type="password" 
                    id="passcode-input" 
                    class="input-field" 
                    placeholder="Enter your master passcode" 
                    autocomplete="current-password" 
                    autofocus
                    required
                >
                <button type="button" class="toggle-password" onclick="toggleVisibility()" title="Toggle visibility">
                    <span id="eye-icon">👁️</span>
                </button>
            </div>
            <p class="helper-text">
                Protected with rate limiting and automated brute-force lockout.
            </p>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Unlock Cloud</button>
    </form>
</div>

<script>
    function toggleVisibility() {
        const input = document.getElementById('passcode-input');
        const icon = document.getElementById('eye-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerText = '🙈';
        } else {
            input.type = 'password';
            icon.innerText = '👁️';
        }
    }

    function showError(msg) {
        const box = document.getElementById('error-box');
        box.innerText = msg;
        box.style.display = 'block';
    }

    async function submitLogin(e) {
        e.preventDefault();
        const code = document.getElementById('passcode-input').value.trim();
        if (!code) {
            showError("Please enter your master passcode.");
            return;
        }

        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = "Verifying...";

        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ passcode: code })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = '/';
            } else {
                showError(data.error || "Incorrect passcode.");
                document.getElementById('passcode-input').select();
            }
        } catch (err) {
            showError("Network error: " + err);
        } finally {
            btn.disabled = false;
            btn.innerText = "Unlock Cloud";
        }
    }
</script>
</body>
</html>
